name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Official GraphQL contribution calendar. The token stays in this job
      # and is never written into client assets. If github.token cannot read
      # the public profile calendar, add a fine-grained PAT as the repository
      # secret CONTRIBUTIONS_GH_TOKEN (public read is enough). A failed fetch
      # leaves the labeled illustrative calendar in place and still deploys.
      - name: Fetch public GitHub contribution calendar
        run: node scripts/generate-github-contributions.mjs
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTIONS_GH_TOKEN || github.token }}
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npm run pdf
      - run: npm run pdf:verify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
